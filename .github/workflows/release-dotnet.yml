# Publica FaroHQ.AspNetCore no NuGet ao criar a tag dotnet-vX.Y.Z
name: release-dotnet
on:
  push:
    tags: ["dotnet-v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build samples/FaroHQ.Sample -c Release
      - run: dotnet pack src/FaroHQ.AspNetCore -c Release -o out -p:Version=${GITHUB_REF_NAME#dotnet-v}
      - run: dotnet nuget push "out/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
