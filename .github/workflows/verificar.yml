# Roda os testes de todos os SDKs (e compila o .NET) a cada push/PR. Não publica nada:
# a publicação continua no publicar.yml, por tag ou manual.
name: verificar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: java } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - run: chmod +x gradlew && ./gradlew test --no-daemon

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: node } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci || npm install
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: browser } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci || npm install
      - run: npm test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: dotnet } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet build samples/FaroHQ.Sample -c Release

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: flutter } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
