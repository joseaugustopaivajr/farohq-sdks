# Publica farohq no PyPI ao criar a tag python-vX.Y.Z (Trusted Publishing: sem token)
name: release-python
on:
  push:
    tags: ["python-v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#python-v}\"/" pyproject.toml
      - run: python -m unittest discover -s tests
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
