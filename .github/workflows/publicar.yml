# Publica os SDKs nos registros públicos (Maven Central, npm, PyPI, NuGet).
#
# Dois jeitos:
#  1. GitHub → Actions → "Publicar SDKs" → Run workflow: escolha o pacote e (opcional) a versão.
#     Sem versão, usa a que está no arquivo do pacote (build.gradle, package.json, pyproject.toml, .csproj).
#  2. Tag: java-vX.Y.Z, node-vX.Y.Z, python-vX.Y.Z, dotnet-vX.Y.Z ou browser-vX.Y.Z.
#
# Guia completo (contas, segredos, versões): PUBLICACAO.md
name: Publicar SDKs
run-name: "Publicar ${{ inputs.pacote || github.ref_name }} ${{ inputs.versao }}"

on:
  workflow_dispatch:
    inputs:
      pacote:
        description: "Qual pacote publicar"
        type: choice
        required: true
        default: todos
        options: [todos, java, node, browser, python, dotnet]
      versao:
        description: "Versão (ex.: 0.3.0). Vazio = a versão que está no arquivo do pacote"
        type: string
        required: false
  push:
    tags: ["java-v*", "node-v*", "browser-v*", "python-v*", "dotnet-v*"]

permissions:
  contents: read

jobs:
  java:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.pacote == 'todos' || inputs.pacote == 'java')) ||
      startsWith(github.ref, 'refs/tags/java-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: java } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - name: Versão
        id: v
        run: |
          V="${{ inputs.versao }}"
          [[ "$GITHUB_REF" == refs/tags/java-v* ]] && V="${GITHUB_REF_NAME#java-v}"
          [ -z "$V" ] && V=$(sed -nE 's/^VERSION_NAME=(.+)$/\1/p' gradle.properties)
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: chmod +x gradlew && ./gradlew test --no-daemon
      - name: Publicar no Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral -PVERSION_NAME=${{ steps.v.outputs.version }} --no-configuration-cache --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Resumo
        run: |
          {
            echo "### Java/Kotlin ${{ steps.v.outputs.version }} enviado ao Maven Central"
            echo "Aparece em https://central.sonatype.com/artifact/br.com.farohq/farohq-java em até ~30 min."
            echo '```kotlin'
            echo 'implementation("br.com.farohq:farohq-java:${{ steps.v.outputs.version }}")'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  node:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.pacote == 'todos' || inputs.pacote == 'node')) ||
      startsWith(github.ref, 'refs/tags/node-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, id-token: write } # provenance do npm
    defaults: { run: { working-directory: node } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", registry-url: "https://registry.npmjs.org" }
      - name: Versão
        id: v
        run: |
          V="${{ inputs.versao }}"
          [[ "$GITHUB_REF" == refs/tags/node-v* ]] && V="${GITHUB_REF_NAME#node-v}"
          [ -z "$V" ] && V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: npm ci || npm install
      - run: npm version ${{ steps.v.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm publish --provenance --access public
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
      - run: echo "### @farohqbr/node ${{ steps.v.outputs.version }} publicado — https://www.npmjs.com/package/@farohqbr/node" >> "$GITHUB_STEP_SUMMARY"

  browser:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.pacote == 'todos' || inputs.pacote == 'browser')) ||
      startsWith(github.ref, 'refs/tags/browser-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, id-token: write }
    defaults: { run: { working-directory: browser } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", registry-url: "https://registry.npmjs.org" }
      - name: Versão
        id: v
        run: |
          V="${{ inputs.versao }}"
          [[ "$GITHUB_REF" == refs/tags/browser-v* ]] && V="${GITHUB_REF_NAME#browser-v}"
          [ -z "$V" ] && V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: npm ci || npm install
      - run: npm version ${{ steps.v.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm publish --provenance --access public
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
      - run: echo "### @farohqbr/browser ${{ steps.v.outputs.version }} publicado — https://www.npmjs.com/package/@farohqbr/browser" >> "$GITHUB_STEP_SUMMARY"

  python:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.pacote == 'todos' || inputs.pacote == 'python')) ||
      startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi # o PyPI confere este ambiente no Trusted Publishing (sem token)
    permissions: { contents: read, id-token: write }
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Versão
        id: v
        run: |
          V="${{ inputs.versao }}"
          [[ "$GITHUB_REF" == refs/tags/python-v* ]] && V="${GITHUB_REF_NAME#python-v}"
          [ -z "$V" ] && V=$(grep -m1 -oE '^version = "[^"]+"' pyproject.toml | cut -d'"' -f2)
          sed -i "s/^version = .*/version = \"$V\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"$V\"/" src/farohq/__init__.py
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: python -m unittest discover -s tests
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: python/dist }
      - run: echo "### farohq ${{ steps.v.outputs.version }} publicado — https://pypi.org/project/farohq/" >> "$GITHUB_STEP_SUMMARY"

  dotnet:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.pacote == 'todos' || inputs.pacote == 'dotnet')) ||
      startsWith(github.ref, 'refs/tags/dotnet-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, id-token: write } # Trusted Publishing do NuGet (sem chave guardada)
    defaults: { run: { working-directory: dotnet } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Versão
        id: v
        run: |
          V="${{ inputs.versao }}"
          [[ "$GITHUB_REF" == refs/tags/dotnet-v* ]] && V="${GITHUB_REF_NAME#dotnet-v}"
          [ -z "$V" ] && V=$(sed -nE 's/.*<Version>([^<]+)<\/Version>.*/\1/p' src/FaroHQ.AspNetCore/FaroHQ.AspNetCore.csproj)
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: dotnet build samples/FaroHQ.Sample -c Release
      - run: dotnet pack src/FaroHQ.AspNetCore -c Release -o out -p:Version=${{ steps.v.outputs.version }}
      - name: Login no NuGet (chave temporária)
        uses: NuGet/login@v1
        id: nuget
        with: { user: "${{ vars.NUGET_USER }}" }
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - run: echo "### FaroHQ.AspNetCore ${{ steps.v.outputs.version }} publicado — https://www.nuget.org/packages/FaroHQ.AspNetCore (indexa em ~15 min)" >> "$GITHUB_STEP_SUMMARY"
