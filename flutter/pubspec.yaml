name: farohq_flutter
description: Error monitoring for Flutter apps (Android and iOS) with FaroHQ. Captures crashes with screens, HTTP calls and breadcrumbs, grouped with the root cause.
version: 0.1.1
homepage: https://www.farohq.com.br
repository: https://github.com/joseaugustopaivajr/farohq-sdks/tree/main/flutter
issue_tracker: https://github.com/joseaugustopaivajr/farohq-sdks/issues
topics: [monitoring, crash-reporting, error-tracking, observability, logging]

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.1.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
